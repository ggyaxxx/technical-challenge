# Redis Enterprise Cluster Manager REST API endpoint (Database API / Users
# API). CLUSTER_API_URL overrides the base URL - use it to substitute the
# cluster's IP address if the hostname does not resolve from wherever this
# runs (the same DNS-resolution issue documented for Redis Insight in
# exercise1-sync/README.md can affect this too).
quarkus.rest-client.cluster-api.url=${CLUSTER_API_URL:https://re-cluster1.ps-redislabs.org:9443}

# The cluster's REST API is served over TLS with a self-signed certificate.
# Trusting it unconditionally is only acceptable for this lab exercise -
# never do this against a production endpoint.
quarkus.tls.cluster-api-tls.trust-all=true
quarkus.tls.cluster-api-tls.hostname-verification-algorithm=NONE
quarkus.rest-client.cluster-api.tls-configuration-name=cluster-api-tls

# Cluster admin credentials, used for HTTP Basic Auth on every request (see
# RestClusterApiGateway). Deliberately NOT given a default value here: these
# are real cluster admin credentials (unlike exercise1-sync's unauthenticated
# Redis endpoints), so they must never be committed to source control.
# Required at runtime as environment variables:
#   CLUSTER_ADMIN_EMAIL=admin@rl.org
#   CLUSTER_ADMIN_PASSWORD=<the Secure UI admin password>
# If either is missing, Quarkus fails fast at startup with a clear
# configuration error instead of silently sending blank credentials.
cluster.admin.email=${CLUSTER_ADMIN_EMAIL}
cluster.admin.password=${CLUSTER_ADMIN_PASSWORD}

quarkus.log.level=WARN
quarkus.banner.enabled=false
