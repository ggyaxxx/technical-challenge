# Two named Redis clients, one per database from Exercise 1.
#
# Quarkus/SmallRye Config resolves "${ENV_VAR:default}" expressions against
# environment variables at startup, so the exact same SOURCE_HOST/SOURCE_PORT/
# REPLICA_HOST/REPLICA_PORT variables we used before (with Jedis) still work
# here - just declared in configuration instead of read manually in Java code.
#
# Defaults point at localhost:6379 purely for quick local smoke-testing
# against a throwaway Redis; in the lab, SOURCE_HOST/SOURCE_PORT/REPLICA_HOST/
# REPLICA_PORT are always provided explicitly (see README.md).
quarkus.redis.source.hosts=redis://${SOURCE_HOST:127.0.0.1}:${SOURCE_PORT:6379}
quarkus.redis.replica.hosts=redis://${REPLICA_HOST:127.0.0.1}:${REPLICA_PORT:6379}

# Keep startup logs minimal and focused on our own output.
quarkus.log.level=WARN
quarkus.banner.enabled=false
