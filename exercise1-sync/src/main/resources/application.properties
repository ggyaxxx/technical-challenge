# Two named Redis clients, one per database from Exercise 1.
#
# Quarkus/SmallRye Config resolves "${ENV_VAR:default}" expressions against
# environment variables at startup, so SOURCE_HOST/SOURCE_PORT/REPLICA_HOST/
# REPLICA_PORT can still override these values at runtime if needed (e.g. if
# the lab's endpoints ever change) - but the defaults below already point at
# this lab's actual source-db / replica-db endpoints (see README.md §1/§3),
# so the app runs out of the box with a plain `java -jar ...`, no env vars
# required.
quarkus.redis.source.hosts=redis://${SOURCE_HOST:redis-10649.re-cluster1.ps-redislabs.org}:${SOURCE_PORT:10649}
quarkus.redis.replica.hosts=redis://${REPLICA_HOST:redis-16135.re-cluster1.ps-redislabs.org}:${REPLICA_PORT:16135}

# Keep startup logs minimal and focused on our own output.
quarkus.log.level=WARN
quarkus.banner.enabled=false
